# gitleaks config (NFR-SEC-007). Default rules plus allowlists for known non-secrets.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and generated files"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)libs/go/gen/''',
  '''(^|/)libs/python/hivespace_contracts/''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)go\.sum$''',
]
# The Service Bus emulator's documented fixed key appears in a test fixture only.
regexes = [
  '''SharedAccessKey=test;''',
  # A marker the Notification test searches for in logs and tables (R-6); not a credential.
  '''tok-SECRET-9f8e7d''',
]
