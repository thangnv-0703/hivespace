[project]
name = "search-ai"
version = "0.1.0"
description = "HiveSpace search-ai service (Python, lean). Generated from templates/python-service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163,<1",
    "uvicorn[standard]>=0.54,<1",
    "pydantic-settings>=2.16,<3",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "hivespace-common",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "httpx>=0.28",
    "ruff>=0.17",
    "mypy>=2.4",
    "import-linter>=2.16",
]

[tool.uv.sources]
hivespace-common = { path = "../../libs/python/hivespace_common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["search_ai"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "search_ai"
include_external_packages = true

# Lean shape (repo-structure §4.4): features do not import each other; vendor SDKs only under providers/.
[[tool.importlinter.contracts]]
name = "Features are independent"
type = "independence"
modules = ["search_ai.features.*"]

[[tool.importlinter.contracts]]
name = "Vendor SDKs only under providers"
type = "forbidden"
source_modules = ["search_ai.features"]
forbidden_modules = ["azure", "openai", "anthropic", "sentence_transformers"]
allow_indirect_imports = true
