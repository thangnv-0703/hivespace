# Stable error codes (FR-LOC-004). Tests assert the code, never the message.
# Messages live in messages.vi.yaml and messages.en.yaml with identical keys (NFR-L10N-004).
codes:
  common.validation_failed: { http: 400 }
  common.unauthenticated: { http: 401 }
  common.forbidden: { http: 403 }
  common.not_found: { http: 404 }
  common.internal: { http: 500 }
  common.dependency_unavailable: { http: 503 }
  common.rate_limited: { http: 429 }
  identity.email_required: { http: 400 }
  identity.email_invalid: { http: 400 }
  identity.email_in_use: { http: 409 }
  identity.display_name_required: { http: 400 }
  identity.display_name_too_long: { http: 400 }
  identity.password_too_short: { http: 400 }
  identity.password_needs_letter: { http: 400 }
  identity.password_needs_digit: { http: 400 }
  identity.password_too_long: { http: 400 }
  identity.verification_token_invalid: { http: 400 }
  identity.verification_token_expired: { http: 400 }
  identity.email_already_verified: { http: 409 }
  identity.invalid_credentials: { http: 401 }
  identity.phone_invalid: { http: 400 }
  identity.gender_invalid: { http: 400 }
  identity.date_of_birth_invalid: { http: 400 }
  identity.date_of_birth_in_future: { http: 400 }
  identity.date_of_birth_too_old: { http: 400 }
  identity.language_unsupported: { http: 400 }
  identity.email_read_only: { http: 400 }
  identity.current_password_required: { http: 400 }
  identity.current_password_incorrect: { http: 400 }
  identity.password_not_set: { http: 409 }
  # Account hardening (FEAT-005).
  identity.account_locked: { http: 423 }
  identity.reauthentication_required: { http: 403 }
  identity.password_already_set: { http: 409 }
  # Email-code sign-in (FEAT-006).
  identity.sign_in_code_invalid: { http: 401 }
  identity.sign_in_code_expired: { http: 401 }
  identity.sign_in_challenge_ended: { http: 401 }
  identity.sign_in_code_too_soon: { http: 429 }
  # Google sign-in (FEAT-004): these travel only in the /signin?error= redirect, http is the nearest status.
  identity.external_login_denied: { http: 401 }
  identity.external_email_unverified: { http: 401 }
  identity.external_login_failed: { http: 401 }
  identity.external_login_unavailable: { http: 503 }
  # Register a shop (FEAT-009).
  identity.email_not_verified: { http: 403 }
  identity.shop_already_owned: { http: 409 }
  identity.shop_name_taken: { http: 409 }
  identity.shop_name_required: { http: 400 }
  identity.shop_name_too_short: { http: 400 }
  identity.shop_name_too_long: { http: 400 }
  identity.shop_name_invalid: { http: 400 }
  identity.seller_type_invalid: { http: 400 }
  # Shop settings (FEAT-010).
  identity.shop_description_too_long: { http: 400 }
  identity.shop_description_invalid: { http: 400 }
  identity.address_field_required: { http: 400 }
  identity.address_field_too_long: { http: 400 }
  identity.address_field_invalid: { http: 400 }
  identity.bank_name_required: { http: 400 }
  identity.bank_name_too_long: { http: 400 }
  identity.bank_name_invalid: { http: 400 }
  identity.bank_account_number_required: { http: 400 }
  identity.bank_account_number_invalid: { http: 400 }
  identity.bank_account_holder_required: { http: 400 }
  identity.bank_account_holder_too_long: { http: 400 }
  identity.bank_account_holder_invalid: { http: 400 }
