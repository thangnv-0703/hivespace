openapi: 3.1.0
info:
  title: HiveSpace Gateway BFF
  version: 1.0.0
  description: Endpoints served by the gateway itself (ADR-0008). The browser never sees a token, only the encrypted `hs.bff` cookie.
servers:
  - url: /
tags:
  - name: bff
paths:
  /bff/user:
    get:
      operationId: getSession
      summary: Session probe. Always 200; `isAuthenticated` is false without a session (D-9).
      tags: [bff]
      security: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
  /bff/session/refresh:
    post:
      operationId: refreshSession
      summary: Force a refresh-token exchange so the token claims (name, language) are current, and return the `/bff/user` body. Needs `X-HS-CSRF`.
      tags: [bff]
      security: []
      parameters:
        - name: X-HS-CSRF
          in: header
          required: true
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Current session; `isAuthenticated` is false with no session or when the refresh failed (the cookie is cleared).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionUser'
        '403':
          description: Missing CSRF header.
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /bff/login:
    get:
      operationId: bffLogin
      summary: Start the OIDC sign-in; browser navigation, not a fetch.
      tags: [bff]
      security: []
      parameters:
        - name: returnUrl
          in: query
          required: false
          schema: { type: string }
          description: Local path on the calling host only (storefront or seller host, ADR-0027); anything else becomes `/`.
      responses:
        '302':
          description: Redirect to the authorize endpoint.
  /bff/logout:
    post:
      operationId: bffLogout
      summary: Same-origin form POST; revokes the refresh token and ends both sessions (D-4).
      tags: [bff]
      security: []
      responses:
        '302':
          description: Redirect through Identity end-session back to `/` of the calling host (ADR-0027).
components:
  schemas:
    SessionUser:
      type: object
      required: [isAuthenticated]
      properties:
        isAuthenticated: { type: boolean }
        userId:
          $ref: './shared/components.yaml#/components/schemas/Id'
        email: { type: string }
        displayName: { type: string }
        emailVerified: { type: boolean }
        roles:
          type: array
          items: { type: string }
        language: { type: string, enum: [vi, en] }
