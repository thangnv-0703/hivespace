openapi: 3.1.0
info:
  title: HiveSpace Identity API
  version: 1.0.0
  description: Registration, email verification and password sign-in (FEAT-001). OpenIddict endpoints (`/connect/*`) follow the OIDC standard and are not listed here. The Google sign-in endpoints (`/connect/external/{provider}/start`, `/callback`, `/complete`, FEAT-004) are browser redirect endpoints like `/connect/*`; they are not listed here either and are specified by `contracts/features/identity/google-sign-in.feature`.
servers:
  - url: /
tags:
  - name: identity
paths:
  /v1/users:
    post:
      operationId: registerUser
      summary: Register a buyer account (unverified) and queue the verification email.
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, displayName, password]
              properties:
                email: { type: string, maxLength: 254 }
                displayName: { type: string }
                password: { type: string, format: password }
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId:
                    $ref: './shared/components.yaml#/components/schemas/Id'
        '400':
          description: "`common.validation_failed` with one details entry per failed rule."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '409':
          description: "`identity.email_in_use`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/users/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with the token from the link.
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: Email verified.
        '400':
          description: "`identity.verification_token_invalid` or `identity.verification_token_expired`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '409':
          description: "`identity.email_already_verified`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/users/verification-email:
    post:
      operationId: resendVerificationEmail
      summary: Request a new verification link. Always 202 for a well-formed email (no enumeration).
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, maxLength: 254 }
      responses:
        '202':
          description: Accepted; a link is sent only if the account exists and is unverified.
        '400':
          description: "`common.validation_failed` for a malformed email."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/users/sign-in:
    post:
      operationId: signIn
      summary: Check credentials and start the Identity session (cookie `hs.idp`).
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, format: password }
                returnUrl:
                  type: string
                  description: Honored only when it is a local path starting with `/connect/authorize`.
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string }
        '401':
          description: "`identity.invalid_credentials` (same body for every failure cause)."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '423':
          description: "`identity.account_locked`: five wrong attempts within 15 minutes lock the account for 15 minutes (FR-AUTH-011, FR-AUTH-012). Also the attempt that causes the lock."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '429':
          description: "`common.rate_limited` from the gateway (NFR-SEC-005), with `Retry-After`."
          headers:
            Retry-After: { description: Seconds until the limit window resets, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/users/sign-in/code-challenges:
    post:
      operationId: requestSignInCode
      summary: Email a 6-digit sign-in code. Same 201 for any well-formed email (no enumeration, FR-AUTH-029).
      description: >-
        Ends every open code of the address and issues a new one valid for 5 minutes (FR-AUTH-028, FR-AUTH-034).
        The code is emailed only when an account exists. One request per address per 60 seconds (FR-AUTH-033).
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInCodeRequest'
      responses:
        '201':
          description: A challenge was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInChallenge'
        '400':
          description: "`common.validation_failed` for a malformed email."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '429':
          description: >-
            `identity.sign_in_code_too_soon`: a code was requested for this address less than 60 seconds ago;
            or `common.rate_limited` from the gateway (NFR-SEC-005). Both carry `Retry-After`.
          headers:
            Retry-After: { description: Seconds until a new request is accepted, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/users/sign-in/code:
    post:
      operationId: signInWithCode
      summary: Check an emailed code and start the Identity session (cookie `hs.idp`, `amr` `otp`).
      description: >-
        The code is compared only for an open, unexpired challenge of an account that is not locked (FR-AUTH-035).
        A wrong code counts on the challenge (five end it, FR-AUTH-032) and on the account's lockout (FR-AUTH-031).
        A correct code is accepted once and verifies the email (FR-AUTH-030, FR-AUTH-036).
      tags: [identity]
      security: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInWithCodeRequest'
      responses:
        '200':
          description: Signed in; `Set-Cookie` carries `hs.idp`.
          headers:
            Set-Cookie: { description: The Identity session cookie `hs.idp`, schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string }
        '400':
          description: "`common.validation_failed` when the code is not six digits (detail on `code`). Not counted."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: >-
            `identity.sign_in_code_invalid` (wrong code), `identity.sign_in_code_expired` (past its 5 minutes) or
            `identity.sign_in_challenge_ended` (used, replaced, five wrong codes, or unknown challenge). Same bodies whether or not the email has an account.
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '423':
          description: "`identity.account_locked`: the account is locked (FR-AUTH-035); the code is not checked. Also the wrong code that causes the lock."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '429':
          description: "`common.rate_limited` from the gateway (NFR-SEC-005), with `Retry-After`."
          headers:
            Retry-After: { description: Seconds until the limit window resets, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/me/profile:
    get:
      operationId: getMyProfile
      summary: The signed-in user's profile. The user is always the token's `sub`.
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
    put:
      operationId: updateMyProfile
      summary: Replace the four editable fields. `null` clears phone, gender and date of birth.
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          description: Saved. Unchanged values also return 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: "`common.validation_failed` with one details entry per invalid field; an `email` key gives `identity.email_read_only`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/me/profile/language:
    put:
      operationId: updateMyLanguage
      summary: Save the preferred language. Same value again is 200 and queues no event.
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageUpdate'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageUpdate'
        '400':
          description: "`common.validation_failed` with `identity.language_unsupported`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/me/password:
    put:
      operationId: changeMyPassword
      summary: Change the password. Signs out every other session of the account and keeps this one (FR-AUTH-024).
      description: >
        Replaces the credential. The response carries `Set-Cookie: hs.idp` when the request had a valid `hs.idp` for the
        same user. Repeating the call after a success fails on the current password, so clients never retry it.
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Password changed; other sessions are signed out.
        '400':
          description: "`common.validation_failed` with `identity.current_password_required`, `identity.current_password_incorrect` or the password rule codes on `newPassword`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '409':
          description: "`identity.password_not_set`: the account has no password (Google-created account)."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '423':
          description: "`identity.account_locked`: five wrong attempts within 15 minutes lock the account for 15 minutes (FR-AUTH-011, FR-AUTH-012). Also the attempt that causes the lock."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '429':
          description: "`common.rate_limited` from the gateway (NFR-SEC-005), with `Retry-After`."
          headers:
            Retry-After: { description: Seconds until the limit window resets, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/me/password/initial:
    put:
      operationId: setMyPassword
      summary: Set a first password on an account that has none, after a recent Google sign-in (FR-AUTH-027).
      description: >
        Needs an access token whose `amr` contains `google` and whose `auth_time` is at most 10 minutes old. Signs out every
        other session and keeps this one; queues `PasswordChanged/v1`. The response carries `Set-Cookie: hs.idp` when the
        request had a valid `hs.idp` for the same user.
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSet'
      responses:
        '204':
          description: Password set; other sessions are signed out.
        '400':
          description: "`common.validation_failed` with the password rule codes on `newPassword`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '403':
          description: "`identity.reauthentication_required`: no Google sign-in in the last 10 minutes."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '409':
          description: "`identity.password_already_set`: the account already has a password."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '429':
          description: "`common.rate_limited` from the gateway (NFR-SEC-005), with `Retry-After`."
          headers:
            Retry-After: { description: Seconds until the limit window resets, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/shops:
    post:
      operationId: registerShop
      summary: Register the caller's shop and grant the Seller role in one transaction (FR-SHOP-001, FR-ROLE-002).
      description: >-
        The owner is always the token's `sub`. Needs a verified email, read from the database. One shop per user
        (FR-SHOP-002) and one normalized name per shop (FR-SHOP-003). The access token shows `role: Seller` after the next
        session refresh (`POST /bff/session/refresh`).
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopRegistration'
      responses:
        '201':
          description: Shop created; the caller is now a seller.
          headers:
            Location: { description: "`/v1/shops/me`", schema: { type: string } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyShop'
        '400':
          description: "`common.validation_failed` with one details entry per invalid field (`name`, `sellerType`); an unknown key is a field error too."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '403':
          description: "`identity.email_not_verified`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '409':
          description: "`identity.shop_already_owned` or `identity.shop_name_taken`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
  /v1/shops/me:
    get:
      operationId: getMyShop
      summary: The caller's own shop. Seller role required (FR-ROLE-003).
      tags: [identity]
      security:
        - bearer: []
      parameters:
        - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The shop.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyShop'
        '401':
          description: "`common.unauthenticated`."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '403':
          description: "`common.forbidden`: the token has no Seller role."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
        '404':
          description: "`common.not_found`: a Seller role without a shop (not reachable through the API)."
          content:
            application/json:
              schema:
                $ref: './shared/components.yaml#/components/schemas/Error'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Identity (audience `hivespace-api`). The gateway relays it from the session cookie.
  schemas:
    Gender:
      type: string
      enum: [male, female, other, prefer_not_to_say]
    Language:
      type: string
      enum: [vi, en]
    LanguageUpdate:
      type: object
      required: [language]
      properties:
        language:
          $ref: '#/components/schemas/Language'
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      additionalProperties: false
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }
    PasswordSet:
      type: object
      required: [newPassword]
      additionalProperties: false
      properties:
        newPassword: { type: string, format: password }
    Profile:
      type: object
      required: [userId, email, displayName, phone, gender, dateOfBirth, avatarUrl, language, hasPassword]
      properties:
        userId:
          $ref: './shared/components.yaml#/components/schemas/Id'
        email:
          type: string
          readOnly: true
          description: Read-only (FR-PROF-004).
        displayName: { type: string, minLength: 1, maxLength: 80 }
        phone:
          type: [string, 'null']
          description: E.164, `+84xxxxxxxxx`.
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        dateOfBirth:
          type: [string, 'null']
          format: date
        avatarUrl:
          type: [string, 'null']
          description: Always null until FEAT-035; the UI shows initials.
        language:
          $ref: '#/components/schemas/Language'
        hasPassword:
          type: boolean
          readOnly: true
          description: True when the account has a password; false for a Google-only account (FR-AUTH-027).
    ProfileUpdate:
      type: object
      description: The full editable representation (PUT, never PATCH). All four keys are required; the last three may be null.
      required: [displayName, phone, gender, dateOfBirth]
      additionalProperties: false
      properties:
        displayName: { type: string }
        phone:
          type: [string, 'null']
          description: "`0` or `+84` followed by 9 digits; spaces, dots and dashes are ignored."
        gender:
          oneOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        dateOfBirth:
          type: [string, 'null']
          format: date
    SellerType:
      type: string
      enum: [individual, business]
      description: Recorded, never verified (FR-SHOP-004).
    ShopRegistration:
      type: object
      required: [name, sellerType]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Trimmed, inner whitespace collapsed, 3 to 60 characters, no control characters.
        sellerType:
          $ref: '#/components/schemas/SellerType'
    MyShop:
      type: object
      required: [shopId, name, sellerType, createdAt, setup]
      properties:
        shopId:
          $ref: './shared/components.yaml#/components/schemas/Id'
        name: { type: string }
        sellerType:
          $ref: '#/components/schemas/SellerType'
        createdAt: { type: string, format: date-time }
        setup:
          type: object
          description: Feeds the seller-centre setup checklist; both stay false until FEAT-010.
          required: [pickupAddress, payout]
          properties:
            pickupAddress: { type: boolean }
            payout: { type: boolean }
    SignInCodeRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }
    SignInChallenge:
      type: object
      required: [challengeId, expiresAt, resendAvailableAt]
      properties:
        challengeId:
          $ref: './shared/components.yaml#/components/schemas/Id'
        expiresAt:
          type: string
          format: date-time
          description: When the code stops working (5 minutes after issue).
        resendAvailableAt:
          type: string
          format: date-time
          description: When a new code can be requested (60 seconds after issue).
    SignInWithCodeRequest:
      type: object
      required: [challengeId, code]
      additionalProperties: false
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The six digits from the email.
        returnUrl:
          type: string
          description: Honored only when it is a local path starting with `/connect/authorize`.
