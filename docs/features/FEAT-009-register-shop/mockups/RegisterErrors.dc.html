<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Open your shop, errors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Outfit','Noto Sans','Segoe UI',system-ui,sans-serif;color:#101828}
a{color:#3641f5}a:hover{color:#2a31d8}
</style>
</helmet>
<div style="width: 560px; height: 760px; box-sizing: border-box; background: #ffffff; padding: 40px 56px; display: flex; flex-direction: column; gap: 32px">
  <section aria-label="Validation errors" style="display: flex; flex-direction: column; gap: 16px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #667085">Validation errors (submit)</p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="e-name" style="font-size: 14px; font-weight: 500; color: #344054">Shop name <span aria-hidden="true" style="color: #d92d20">*</span></label>
      <input id="e-name" type="text" value="An" aria-invalid="true" aria-describedby="e-name-err" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #d92d20; border-radius: 8px; background: #ffffff; font: 400 14px 'Outfit','Noto Sans',sans-serif; color: #101828">
      <p id="e-name-err" role="alert" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: #b42318">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Use at least 3 characters.</p>
    </div>
    <fieldset aria-describedby="e-type-err" style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #344054">Seller type <span aria-hidden="true" style="color: #d92d20">*</span></legend>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px"><input type="radio" name="e-type" style="width: 20px; height: 20px; margin: 0; accent-color: #465fff">Individual</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px"><input type="radio" name="e-type" style="width: 20px; height: 20px; margin: 0; accent-color: #465fff">Business</label>
      <p id="e-type-err" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: #b42318">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>Choose a seller type.</p>
    </fieldset>
  </section>
  <section aria-label="Name taken" style="display: flex; flex-direction: column; gap: 16px; padding-top: 24px; border-top: 1px solid #e4e7ec">
    <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #667085">Name taken (409)</p>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="t-name" style="font-size: 14px; font-weight: 500; color: #344054">Shop name <span aria-hidden="true" style="color: #d92d20">*</span></label>
      <input id="t-name" type="text" value="tiệm bánh an" aria-invalid="true" aria-describedby="t-name-err" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #d92d20; border-radius: 8px; background: #ffffff; font: 400 14px 'Outfit','Noto Sans',sans-serif; color: #101828">
      <p id="t-name-err" role="alert" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: #b42318">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>This shop name is already taken. Try another.</p>
    </div>
  </section>
  <section aria-label="Server error" style="display: flex; flex-direction: column; gap: 16px; padding-top: 24px; border-top: 1px solid #e4e7ec">
    <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #667085">Network or server error</p>
    <div role="alert" style="display: flex; gap: 12px; padding: 16px; border-radius: 8px; background: #fef3f2; color: #b42318">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d92d20" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <div style="font-size: 14px; line-height: 20px"><p style="margin: 0">We couldn't open your shop. Try again.</p><p style="margin: 4px 0 0; font-size: 12px; color: #667085">Error code: common.internal</p></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
