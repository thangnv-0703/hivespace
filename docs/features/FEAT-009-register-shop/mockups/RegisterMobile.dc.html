    <button type="button" aria-label="Switch to dark theme" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #e4e7ec; border-radius: 8px; background: #ffffff; color: #344054">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>

    <h1 style="margin: 0 0 8px; font-size: 20px; line-height: 30px; font-weight: 600">Open your shop on HiveSpace</h1>
    <p style="margin: 0 0 24px; font-size: 14px; line-height: 20px; color: #667085">Two details and you're a seller. You keep your buyer account.</p>
    <form style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-shop-name" style="font-size: 14px; font-weight: 500; color: #344054">Shop name <span aria-hidden="true" style="color: #d92d20">*</span></label>
        <input id="m-shop-name" type="text" value="Tiệm Bánh An" maxlength="60" style="height: 44px; box-sizing: border-box; padding: 0 14px; border: 1px solid #667085; border-radius: 8px; background: #ffffff; font: 400 16px 'Outfit','Noto Sans',sans-serif; color: #101828">
        <p style="margin: 0; font-size: 12px; line-height: 18px; color: #667085">3–60 characters. Buyers see this name, exactly as you write it.</p>
      </div>
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
        <legend style="padding: 0; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #344054">Seller type <span aria-hidden="true" style="color: #d92d20">*</span></legend>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px"><input type="radio" name="m-seller-type" checked style="width: 20px; height: 20px; margin: 0; accent-color: #465fff">Individual</label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 16px"><input type="radio" name="m-seller-type" style="width: 20px; height: 20px; margin: 0; accent-color: #465fff">Business</label>
        <p style="margin: 0; font-size: 12px; line-height: 18px; color: #667085">We record this as you choose it and don't verify it.</p>
      </fieldset>
      <button type="submit" style="margin-top: 8px; height: 44px; border: 0; border-radius: 8px; background: #465fff; color: #ffffff; font: 500 14px 'Outfit',sans-serif">Open my shop</button>
      <p style="margin: 0; font-size: 12px; line-height: 18px; color: #667085">Next you can add your pickup address and payout details.</p>
    </form>
  </main>
