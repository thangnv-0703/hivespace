<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Outfit','Noto Sans','Segoe UI',system-ui,sans-serif;color:#101828}
a{color:#3641f5}a:hover{color:#2a31d8}
</style>
</helmet>
<div style="width: 720px; height: 440px; box-sizing: border-box; background: #f9fafb; padding: 32px; display: flex; gap: 48px; font-size: 14px">
  <section aria-label="Seller centre account menu" style="flex: 1; display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #667085">Seller centre</p>
    <button type="button" aria-expanded="true" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 8px; border: 0; border-radius: 8px; background: #f2f4f7; color: #101828; font: 500 14px 'Outfit','Noto Sans',sans-serif">
      <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: #dde9ff; color: #2a31d8; font-size: 12px; font-weight: 600">LN</span>Linh Nguyen</button>
    <div role="menu" style="width: 240px; background: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px; box-shadow: 0 12px 16px -4px rgba(16,24,40,0.08); padding: 4px">
      <a role="menuitem" href="#" style="display: flex; align-items: center; height: 40px; padding: 0 12px; border-radius: 8px; color: #101828; text-decoration: none">Go to storefront</a>
      <div style="height: 1px; margin: 4px 0; background: #e4e7ec"></div>
      <button role="menuitem" type="button" style="display: flex; align-items: center; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; color: #101828; font: 400 14px 'Outfit',sans-serif">Sign out</button>
    </div>
  </section>
  <section aria-label="Storefront entry" style="flex: 1; display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #667085">Storefront header (unchanged)</p>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px">
      <a href="#" style="padding: 0 8px; font-size: 14px; color: #344054; text-decoration: none; outline: 2px solid #465fff; outline-offset: 4px; border-radius: 4px">Seller centre</a>
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #e4e7ec; border-radius: 8px; color: #344054; font-size: 12px; font-weight: 500">EN</span>
      <span aria-hidden="true" style="width: 44px; height: 44px; border: 1px solid #e4e7ec; border-radius: 8px"></span>
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 9999px; background: #dde9ff; color: #2a31d8; font-size: 12px; font-weight: 600">LN</span>
    </div>
    <p style="margin: 0; font-size: 12px; line-height: 18px; color: #667085">The only entry, for visitors, buyers and sellers alike. The seller centre sends a visitor to sign in, a buyer without a shop to registration, and a seller to the dashboard. The account menu is unchanged.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":440}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
