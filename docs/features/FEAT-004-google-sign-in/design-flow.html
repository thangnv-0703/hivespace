    g.addEventListener('click', function (ev) { ev.stopPropagation(); showEdge(ed.id); });
    g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showEdge(ed.id); } });
  }

});

// ---- Nodes ----
var gN = document.getElementById('nodes');
nodes.forEach(function (n) {
  var kind = n.ghost ? 'ghost' : (n.kind || 'external'), t = tone(kind);
  var g = el('g', { 'class': 'node k-' + kind + (n.ghost ? ' ghost' : ''), 'data-id': n.id, tabindex: 0, role: 'button', 'aria-label': n.label + (n.sub ? ', ' + n.sub : '') }, gN);
  el('title', {}, g).textContent = n.label + (n.sub ? ' · ' + n.sub : '');
  el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 8, 'class': 'c-mask' }, g);
  el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 8, 'class': 'body', style: n.ghost ? 'fill:color-mix(in srgb,' + t + ' 6%,var(--mask));stroke:' + t : 'fill:color-mix(in srgb,' + t + ' 13%,var(--mask));stroke:color-mix(in srgb,' + t + ' 72%,var(--mask))' }, g);
  if (n.h >= 40) el('g', { 'class': 'sigil', stroke: t, transform: 'translate(' + (n.x + 6) + ' ' + (n.y + 6) + ') scale(0.6875)' }, g).innerHTML = SIGILS[n.sigil || kind] || SIGILS.external;
  var cx = n.x + n.w / 2, cy = n.y + n.h / 2, off = n.sub2 ? -8 : 0, small = n.h < 40;
  el('text', { x: cx, y: cy - (n.sub ? 2 : -4) + off, 'text-anchor': 'middle', 'class': 't-primary', 'font-size': small ? 10 : 11, 'font-weight': 600 }, g).textContent = n.label;
  if (n.sub) el('text', { x: cx, y: cy + (small ? 10 : 13) + off, 'text-anchor': 'middle', 'class': 't-muted', 'font-size': small ? 8 : 9 }, g).textContent = n.sub;
  if (n.sub2) el('text', { x: cx, y: cy + 30 + off, 'text-anchor': 'middle', 'class': 't-muted', 'font-size': 7.5 }, g).textContent = n.sub2;
  n.g = g;
  var act = function () { if (n.flow && flows[n.flow]) showFlow(n.flow); else selectNode(n.id); };
  g.addEventListener('click', function (ev) { ev.stopPropagation(); act(); });
  g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); act(); } });
});

// ---- Comment pins (stacked leftwards along the node's top edge) ----
var gP = document.getElementById('pins'), pinCount = {};
notes.forEach(function (nt) {
  var n = byId[nt.on]; if (!n) return;
  var k = pinCount[nt.on] = (pinCount[nt.on] || 0) + 1;
  var g = el('g', { 'class': 'pin ' + (nt.st || 'consider') + (n.ghost ? ' ghost' : ''), tabindex: 0, role: 'button', 'aria-label': 'Note ' + nt.id + ': ' + nt.t, transform: 'translate(' + (n.x + n.w - 6 - (k - 1) * 22) + ' ' + n.y + ')' }, gP);
  el('title', {}, g).textContent = nt.id + ' · ' + nt.t;
  el('circle', { r: 9 }, g);
  el('text', { y: 3, 'text-anchor': 'middle' }, g).textContent = nt.id;
  g.addEventListener('click', function (ev) { ev.stopPropagation(); showNote(nt.id); });
  g.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); showNote(nt.id); } });
});

// ---- Legend (only what the diagram uses; legend items are not .node/.edge so they never dim) ----
var legend = document.getElementById('legend');
var lgY = meta.legendY != null ? meta.legendY : vb[1] - 62;
legend.setAttribute('transform', 'translate(' + (meta.legendX || 30) + ' ' + lgY + ')');
el('text', { x: 0, y: 0, 'class': 't-primary', 'font-size': 12, 'font-weight': 650 }, legend).textContent = 'Legend';
var usedKinds = [], usedStyles = [], usedStatus = [];
nodes.forEach(function (n) { var k = n.ghost ? 'ghost' : (n.kind || 'external'); if (usedKinds.indexOf(k) < 0) usedKinds.push(k); });
edges.forEach(function (e) { var s = e.s || 'default'; if (usedStyles.indexOf(s) < 0) usedStyles.push(s); });
notes.forEach(function (n) { var s = n.st || 'consider'; if (n.on && usedStatus.indexOf(s) < 0) usedStatus.push(s); });
var lx = 0;
Object.keys(KINDS).filter(function (k) { return usedKinds.indexOf(k) >= 0; }).forEach(function (k) {
  var g = el('g', { 'class': 'lg', transform: 'translate(' + lx + ' 14)' }, legend), t = tone(k);
  el('rect', { x: 0, y: 0, width: 14, height: 14, rx: 3, 'class': 'body', style: 'fill:color-mix(in srgb,' + t + ' 13%,var(--mask));stroke:' + t + (k === 'ghost' ? ';stroke-dasharray:3 2' : '') }, g);
  el('text', { x: 20, y: 11, 'class': 't-muted', 'font-size': 10, 'font-weight': 500 }, g).textContent = KINDS[k].label;
  lx += 30 + KINDS[k].label.length * 6.2;
});
var STYLE_LBL = Object.assign({ emphasis: 'Primary flow', default: 'Call / read-write', security: 'Auth / secrets', dashed: 'Async / deploy', ghost: 'Consideration' }, meta.edgeLabels || {});
lx = 0;
['emphasis', 'default', 'security', 'dashed', 'ghost'].filter(function (s) { return usedStyles.indexOf(s) >= 0; }).forEach(function (s) {
  var g = el('g', { 'class': 'lg s-' + s, transform: 'translate(' + lx + ' 44)' }, legend);
  el('path', { d: 'M0 0 L26 0', 'class': 'line', 'marker-end': 'url(#ah-' + (s === 'dashed' ? 'default' : s) + ')' }, g);
  el('text', { x: 34, y: 3.5, 'class': 't-muted', 'font-size': 10 }, g).textContent = STYLE_LBL[s];
  lx += 44 + STYLE_LBL[s].length * 6.2;
});
usedStatus.forEach(function (st) {
  var g = el('g', { 'class': 'pin ' + st, transform: 'translate(' + (lx + 9) + ' 44)', style: 'cursor:default' }, legend);
  el('circle', { r: 7 }, g);
  el('text', { x: 14, y: 3.5, 'font-size': 10, style: 'fill:var(--text-muted);font-weight:400' }, g).textContent = STATUS[st] + ' note';
  lx += 36 + (STATUS[st].length + 5) * 6.2;
});

// ---- Toolbar ----
var tb = document.getElementById('toolbar');
function tbtn(html, attrs) { var b = document.createElement('button'); b.type = 'button'; b.innerHTML = html; for (var k in attrs) b.setAttribute(k, attrs[k]); tb.appendChild(b); return b; }
(meta.links || []).forEach(function (l) { var a = document.createElement('a'); a.href = l.href; a.textContent = l.label; tb.appendChild(a); });
tbtn('All', { 'data-flow': 'all', 'aria-pressed': 'true' });
Object.keys(flows).forEach(function (k) {
  if (k === 'all') return;
  var c = flows[k].color ? '<span class="chip-dot" style="background:' + tone(flows[k].color) + '"></span>' : '';
  tbtn(c + (flows[k].button || flows[k].title), { 'data-flow': k, 'aria-pressed': 'false' });
});
var sep = document.createElement('span'); sep.className = 'sep'; tb.appendChild(sep);
var hasPins = notes.some(function (n) { return n.on && byId[n.on]; });
var hasGhost = nodes.some(function (n) { return n.ghost; }) || edges.some(function (e) { return e.ghost; });
var btnPins = hasPins ? tbtn('Comments', { id: 'btn-pins', 'aria-pressed': 'true' }) : null;
var btnGhost = hasGhost ? tbtn('Considerations', { id: 'btn-ghost', 'aria-pressed': 'false' }) : null;
var btnTheme = tbtn('Theme', { id: 'btn-theme', title: 'Toggle theme (T)' });

// ---- Side panel & interaction ----
var side = document.getElementById('side'), badges = document.getElementById('badges'), current = 'all';
var allFlow = Object.assign({ title: meta.title || 'Overview', intro: 'Pick a flow above, or click any component, arrow or numbered pin.', steps: [] }, flows.all || {});
function flowOf(k) { return k === 'all' ? allFlow : flows[k]; }
function clearHighlight() { svg.classList.remove('dim'); nodes.forEach(function (n) { n.g.classList.remove('on', 'selected'); }); edges.forEach(function (e) { e.g.classList.remove('on'); }); badges.innerHTML = ''; }
function highlight(ids, extra) {
  svg.classList.add('dim');
  ids.forEach(function (id) { var e = edgeById[id]; if (!e) return; e.g.classList.add('on'); if (byId[e.from]) byId[e.from].g.classList.add('on'); if (byId[e.to]) byId[e.to].g.classList.add('on'); });
  (extra || []).forEach(function (id) { if (byId[id]) byId[id].g.classList.add('on'); });
}
function badge(num, edgeId) {
  // Badges sit just before the arrowhead: steps often share a trunk start (fan-outs, buses).
  var e = edgeById[edgeId]; if (!e) return;
  var path = e.g.querySelector('path.line'), p = path.getPointAtLength(Math.max(0, path.getTotalLength() - 16));
  var g = el('g', { 'class': 'step-badge', transform: 'translate(' + p.x + ' ' + p.y + ')' }, badges);
  el('circle', { r: 8 }, g);
  el('text', { y: 3.2, 'text-anchor': 'middle' }, g).textContent = num;
}
function setGhost(on) { if (!btnGhost) return; svg.classList.toggle('show-ghost', on); btnGhost.setAttribute('aria-pressed', String(on)); }
function specHtml(id) {
  var s = specs[id]; if (!s) return '';
  var rows = meta.specRows || [['host', 'Hosting'], ['trigger', 'Triggered by'], ['ops', 'Does'], ['data', 'Data'], ['nfr', 'NFR / notes']];
  var extra = Object.keys(s).filter(function (k) { return !rows.some(function (r) { return r[0] === k; }); }).map(function (k) { return [k, k.charAt(0).toUpperCase() + k.slice(1)]; });
  return '<dl class="spec">' + rows.concat(extra).map(function (r) { var v = s[r[0]]; return v ? '<dt>' + r[1] + '</dt><dd>' + list(v) + '</dd>' : ''; }).join('') + '</dl>';
}
function dataHtml(d) {
  var rows = [['Payload', d.p], ['Format', d.f], ['Class', d.c ? rich('[[' + d.c + ']]') : ''], ['Security', d.s], ['When', d.w]].filter(function (r) { return r[1]; });
  return '<div class="kv">' + rows.map(function (r) { return '<span>' + r[0] + '</span><span>' + rich(r[1]) + '</span>'; }).join('') + '</div>';
}
function showFlow(key) {
  current = key;
  tb.querySelectorAll('[data-flow]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.flow === key)); });
  clearHighlight();
  var f = flowOf(key), steps = f.steps || [];
  if (steps.some(function (s) { return s.e.some(function (id) { return edgeById[id] && edgeById[id].ghost; }); })) setGhost(true);
  var html = '<div class="eyebrow">' + (key === 'all' ? 'Overview' : (f.eyebrow || 'Flow')) + '</div><h2>' + rich(f.title) + '</h2>' + (f.intro ? '<p>' + rich(f.intro) + '</p>' : '');
  if (f.tags) html += '<p>' + f.tags.map(function (t) { return '<span class="tagp">' + rich(t) + '</span>'; }).join('') + '</p>';
  if (steps.length) {
    var ids = [];
    steps.forEach(function (s, i) { ids = ids.concat(s.e); badge(i + 1, s.e[0]); });
    highlight(ids, f.nodes);
    html += '<ol>' + steps.map(function (s) { return '<li>' + rich(s.t) + '</li>'; }).join('') + '</ol>';
  } else if (meta.overview) {
    html += '<div class="kv">' + meta.overview.map(function (r) { return '<span>' + rich(r[0]) + '</span><span>' + rich(r[1]) + '</span>'; }).join('') + '</div>';
  }
  side.innerHTML = html + '<p class="hint">Click a component, an arrow or a numbered pin · T toggles the theme · Esc resets</p>';
}
function selectNode(id) {
  var n = byId[id]; clearHighlight();
  tb.querySelectorAll('[data-flow]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
  var vis = function (e) { return !e.ghost || svg.classList.contains('show-ghost'); };
  var ins = edges.filter(function (e) { return e.to === id && vis(e); }), outs = edges.filter(function (e) { return e.from === id && vis(e); });
  highlight(ins.concat(outs).map(function (e) { return e.id; }), [id]);
  n.g.classList.add('selected');
  function rel(e, other, arrow) { var o = byId[other] || { label: other }; return '<button type="button" data-edge="' + e.id + '">' + arrow + ' <span class="tag">' + o.label + '</span>' + (e.data && e.data.p ? ' · ' + rich(e.data.p) : (e.label ? ' · ' + e.label : '')) + '</button>'; }
  var pins = notes.filter(function (nt) { return nt.on === id; });
  side.innerHTML = '<div class="eyebrow">' + KINDS[n.ghost ? 'ghost' : (n.kind || 'external')].label + '</div><h2>' + n.label + '</h2>' + (n.desc ? '<p>' + rich(n.desc) + '</p>' : '') + specHtml(id) +
    (ins.length + outs.length ? '<div class="links">' + ins.map(function (e) { return rel(e, e.from, '←'); }).join('') + outs.map(function (e) { return rel(e, e.to, '→'); }).join('') + '</div>' : '') +
    pins.map(function (p) { return '<div class="note-box">' + chip(p.st || 'consider') + ' <b>' + p.id + ' · ' + rich(p.t) + '</b><div style="margin-top:.3rem">' + rich(p.b) + '</div></div>'; }).join('') +
    (specs[id] ? '<p class="hint"><button class="linkish" type="button" data-goto="svc-' + id + '">Open in catalogue</button> · Esc returns</p>' : '<p class="hint">Esc returns</p>');
}
function showEdge(id) {
  var e = edgeById[id]; clearHighlight(); highlight([id]);
  side.innerHTML = '<div class="eyebrow">Connection · data contract</div><h2>' + (byId[e.from] || {}).label + ' → ' + (byId[e.to] || {}).label + '</h2>' + dataHtml(e.data || {}) + '<p class="hint">Esc returns to ' + rich(flowOf(current).title) + '</p>';
}
function showNote(nid) {
  var nt = notes.filter(function (x) { return x.id === nid; })[0]; clearHighlight();
  if (nt.on && byId[nt.on]) { highlight([], [nt.on]); byId[nt.on].g.classList.add('selected'); }
  side.innerHTML = '<div class="eyebrow">Note ' + nt.id + '</div><h2>' + rich(nt.t) + '</h2><p>' + chip(nt.st || 'consider') + (nt.on && byId[nt.on] ? ' <span class="refs">on ' + byId[nt.on].label + '</span>' : '') + '</p><p>' + rich(nt.b) + '</p>' + (nt.r ? '<p class="refs">Refs: ' + rich(nt.r) + '</p>' : '') +
    '<p class="hint"><button class="linkish" type="button" data-goto="note-' + nt.id + '">Show in notes list</button> · Esc returns</p>';
}
side.addEventListener('click', function (ev) {
  var eb = ev.target.closest('[data-edge]'); if (eb) { if (edgeById[eb.dataset.edge].data) showEdge(eb.dataset.edge); return; }
  var t = ev.target.closest('[data-goto]'); if (!t) return;
  var target = document.getElementById(t.dataset.goto); if (!target) return;
  target.hidden = false; target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  target.classList.add('flash'); setTimeout(function () { target.classList.remove('flash'); }, 1600);
});
tb.querySelectorAll('[data-flow]').forEach(function (b) { b.addEventListener('click', function () { showFlow(b.dataset.flow); }); });
svg.addEventListener('click', function () { showFlow(current); });
if (btnGhost) btnGhost.addEventListener('click', function () { setGhost(!svg.classList.contains('show-ghost')); });
if (btnPins) btnPins.addEventListener('click', function () { var hide = !svg.classList.contains('hide-pins'); svg.classList.toggle('hide-pins', hide); btnPins.setAttribute('aria-pressed', String(!hide)); });
function toggleTheme() { var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('flow-diagram-theme', t); } catch (_) {} }
btnTheme.addEventListener('click', toggleTheme);
document.addEventListener('keydown', function (ev) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'TEXTAREA') return;
  if (ev.key === 't' || ev.key === 'T') toggleTheme();
  if (ev.key === 'Escape') showFlow(current);
});

// ---- Sections below the diagram ----
var secEl = document.getElementById('sections');
var sections = M.sections || [notes.length ? { type: 'notes' } : null, Object.keys(specs).length ? { type: 'catalogue' } : null].filter(Boolean);
function head(s, dflt) { return '<h2 class="section-title">' + rich(s.title || dflt) + '</h2>' + (s.lead ? '<p class="section-lead">' + rich(s.lead) + '</p>' : ''); }
sections.forEach(function (s) {
  var wrap = document.createElement('div'), html = '';
  if (s.type === 'notes') {
    html = head(s, 'Design notes') + '<div class="toolbar" style="margin-bottom:.75rem" data-note-filter></div><div class="grid-cards" data-notes>' + notes.map(function (nt) {
      return '<article class="card" id="note-' + nt.id + '" data-st="' + (nt.st || 'consider') + '"><header><h3><span>' + nt.id + '</span>' + chip(nt.st || 'consider') + '<span>' + rich(nt.t) + '</span></h3></header><div class="note-body">' + rich(nt.b) + '</div><div class="refs">' +
        (nt.on && byId[nt.on] ? 'On: ' + byId[nt.on].label : 'Cross-cutting') + (nt.r ? ' · Refs: ' + rich(nt.r) : '') + '</div></article>';
    }).join('') + '</div>';
  } else if (s.type === 'catalogue') {
    html = head(s, 'Component catalogue') + '<div class="grid-cards">' + nodes.filter(function (n) { return specs[n.id]; }).map(function (n) {
      var k = n.ghost ? 'ghost' : (n.kind || 'external'), pins = notes.filter(function (nt) { return nt.on === n.id; });
      return '<article class="card lefty" id="svc-' + n.id + '" style="--tone:' + tone(k) + '"><header><h3>' + n.label + '</h3><span class="kind">' + KINDS[k].label + '</span></header>' + specHtml(n.id) +
        (pins.length ? '<div class="card-notes">' + pins.map(function (p) { return '<a class="note-chip ' + (p.st || 'consider') + '" href="#note-' + p.id + '" style="text-decoration:none">' + p.id + ' · ' + p.t + '</a>'; }).join('') + '</div>' : '') + '</article>';
    }).join('') + '</div>';
  } else if (s.type === 'personas') {
    html = head(s, 'Who does what') + '<div class="grid-cards">' + (s.items || []).map(function (p) {
      return '<article class="card toned" style="--tone:' + tone(p.tone || 'external') + '"><header><div><h3>' + rich(p.title) + '</h3>' + (p.tags ? '<div style="margin-top:.35rem">' + p.tags.map(function (t) { return '<span class="tagp">' + rich(t) + '</span>'; }).join('') + '</div>' : '') + '</div></header>' +
        '<dl class="spec">' + (p.rows || []).map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + list(r[1]) + '</dd>'; }).join('') + '</dl>' +
        (p.flow && flows[p.flow] ? '<div class="toolbar" style="margin-top:.75rem"><button type="button" data-show="' + p.flow + '">Show on diagram</button></div>' : '') + '</article>';
    }).join('') + '</div>';
  } else if (s.type === 'table') {
    var cell = function (v) { v = String(v); if (s.matrix) { if (v === '✓' || v.indexOf('✓') === 0) return '<span class="y">' + v + '</span>'; if (v === '–' || v === '-' || v === 'n/a') return '<span class="n">' + v + '</span>'; return '<span class="p">' + rich(v) + '</span>'; } return rich(v); };
    html = head(s, '') + '<div class="tbl"><table class="grid' + (s.matrix ? ' matrix' : '') + '"><thead><tr>' + (s.columns || []).map(function (c) { return '<th>' + rich(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (s.rows || []).map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td>' + (i === 0 ? rich(c) : cell(c)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  } else if (s.type === 'cards') {
    html = head(s, '') + '<div class="grid-cards narrow">' + (s.items || []).map(function (c) {
      return '<article class="card" style="--tone:' + tone(c.tone || 'external') + '"><header><h3><span class="card-dot"></span>' + rich(c.title) + '</h3></header>' + (c.bullets ? '<ul class="b">' + c.bullets.map(function (b) { return '<li>' + rich(b) + '</li>'; }).join('') + '</ul>' : '') + (c.html ? rich(c.html) : '') + '</article>';
    }).join('') + '</div>';
  } else if (s.type === 'html') {
    html = head(s, '') + rich(s.html || '');
  }
  wrap.innerHTML = html; secEl.appendChild(wrap);
});
secEl.addEventListener('click', function (ev) { var b = ev.target.closest('[data-show]'); if (!b) return; showFlow(b.dataset.show); document.getElementById('diagram').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
var nf = secEl.querySelector('[data-note-filter]'), nl = secEl.querySelector('[data-notes]');
if (nf) {
  var present = ['decision', 'risk', 'consider', 'confirmed', 'aligned'].filter(function (st) { return notes.some(function (n) { return (n.st || 'consider') === st; }); });
  [['all', 'All']].concat(present.map(function (st) { return [st, STATUS[st]]; })).forEach(function (f, i) {
    var b = document.createElement('button'); b.type = 'button';
    b.textContent = f[1] + ' (' + notes.filter(function (n) { return f[0] === 'all' || (n.st || 'consider') === f[0]; }).length + ')';
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', function () {
      nf.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      nl.querySelectorAll('.card').forEach(function (c) { c.hidden = f[0] !== 'all' && c.dataset.st !== f[0]; });
    });
    nf.appendChild(b);
  });
}

// ?flow=<key> pre-selects a flow (handy for screenshots and deep links)
var startFlow = 'all';
try { var qf = new URLSearchParams(location.search).get('flow'); if (qf && flows[qf]) startFlow = qf; } catch (_) {}
showFlow(startFlow);
})();
</script>
