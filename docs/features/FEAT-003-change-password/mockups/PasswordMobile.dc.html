<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Change password, mobile, success</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Outfit','Noto Sans','Segoe UI',system-ui,sans-serif;color:#101828}
a{color:#3641f5}a:hover{color:#2a31d8}
</style>

<div style="width: 100%; min-height: 1000px; background: #f9fafb; position: relative">
  <header style="background: #ffffff; border-bottom: 1px solid #e4e7ec">
    <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px">
      <a href="#" style="flex: 1 1 0; text-decoration: none; color: #101828; font: 700 20px 'Outfit',sans-serif">HiveSpace</a>
      <button type="button" aria-label="Search" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #344054"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
      <button type="button" aria-label="Open menu" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #344054"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg></button>
    </div>
  </header>

  <div role="status" style="position: absolute; top: 64px; left: 8px; right: 8px; display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; background: #ffffff; border-radius: 12px; box-shadow: 0 12px 16px -4px #10182814, 0 4px 6px -2px #10182808; border-left: 4px solid #17b26a">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17b26a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
    <p style="flex: 1 1 0; margin: 0; font-size: 14px; line-height: 20px; color: #101828">Password changed. Other devices have been signed out.</p>
    <button type="button" aria-label="Close" style="width: 32px; height: 32px; margin: -6px -8px 0 0; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #667085"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>

  <main style="padding: 16px 16px 48px">
    <a href="ProfilePasswordCard.dc.html" aria-label="Back to profile" style="display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: 14px; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Profile</a>
    <h1 tabindex="-1" style="margin: 4px 0 4px; font-size: 24px; line-height: 32px; font-weight: 600">Change password</h1>
    <p style="margin: 0 0 16px; font-size: 14px; line-height: 20px; color: #667085">After the change, you stay signed in here and every other device is signed out.</p>
    <section style="background: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px; box-shadow: 0 1px 3px #1018281a; padding: 16px">
      <form style="display: flex; flex-direction: column; gap: 16px">
        <div>
          <label for="m-cur" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #344054">Current password <span style="color: #b42318" aria-hidden="true">*</span></label>
          <input id="m-cur" type="password" autocomplete="current-password" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #667085; border-radius: 8px; background: #ffffff; font: 400 16px 'Outfit','Noto Sans',sans-serif">
        </div>
        <div>
          <label for="m-new" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #344054">New password <span style="color: #b42318" aria-hidden="true">*</span></label>
          <input id="m-new" type="password" autocomplete="new-password" aria-describedby="m-rules" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #667085; border-radius: 8px; background: #ffffff; font: 400 16px 'Outfit','Noto Sans',sans-serif">
          <ul id="m-rules" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 18px; color: #667085">
            <li style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>At least 8 characters</li>
            <li style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>Contains a letter</li>
            <li style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>Contains a number</li>
          </ul>
        </div>
        <div>
          <label for="m-conf" style="display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #344054">Confirm new password <span style="color: #b42318" aria-hidden="true">*</span></label>
          <input id="m-conf" type="password" autocomplete="new-password" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 14px; border: 1px solid #667085; border-radius: 8px; background: #ffffff; font: 400 16px 'Outfit','Noto Sans',sans-serif">
        </div>
        <button type="submit" style="width: 100%; height: 44px; border: 0; border-radius: 8px; background: #465fff; color: #ffffff; font: 500 14px 'Outfit','Noto Sans',sans-serif">Change password</button>
      </form>
    </section>
  </main>
</div>
</x-dc>
