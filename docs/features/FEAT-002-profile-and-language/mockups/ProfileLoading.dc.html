<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My profile, loading</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;font-family:'Outfit','Noto Sans','Segoe UI',system-ui,sans-serif;color:#101828}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: #f9fafb">
  <main aria-busy="true" style="max-width: 1440px; margin: 0 auto; padding: 32px 24px 64px; box-sizing: border-box">
    <div style="max-width: 672px">
      <h1 style="margin: 0 0 4px; font-size: 30px; line-height: 38px; font-weight: 600">My profile</h1>
      <p style="margin: 0 0 24px; font-size: 14px; line-height: 20px; color: #667085">Manage your personal details and language.</p>
      <p role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Loading your profile</p>

      <div aria-hidden="true" style="background: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px; box-shadow: 0 1px 3px #1018281a; padding: 24px">
        <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid #e4e7ec">
          <div style="width: 64px; height: 64px; border-radius: 9999px; background: #f2f4f7"></div>
          <div style="display: flex; flex-direction: column; gap: 8px">
            <div style="width: 160px; height: 18px; border-radius: 6px; background: #f2f4f7"></div>
            <div style="width: 220px; height: 14px; border-radius: 6px; background: #f2f4f7"></div>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 80px; height: 14px; border-radius: 6px; background: #f2f4f7"></div><div style="height: 44px; border-radius: 8px; background: #f2f4f7"></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 110px; height: 14px; border-radius: 6px; background: #f2f4f7"></div><div style="height: 44px; border-radius: 8px; background: #f2f4f7"></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 70px; height: 14px; border-radius: 6px; background: #f2f4f7"></div><div style="height: 44px; border-radius: 8px; background: #f2f4f7"></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 70px; height: 14px; border-radius: 6px; background: #f2f4f7"></div><div style="width: 420px; height: 24px; border-radius: 6px; background: #f2f4f7"></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><div style="width: 100px; height: 14px; border-radius: 6px; background: #f2f4f7"></div><div style="width: 352px; height: 44px; border-radius: 8px; background: #f2f4f7"></div></div>
          <div style="display: flex; justify-content: flex-end; padding-top: 8px"><div style="width: 128px; height: 44px; border-radius: 8px; background: #f2f4f7"></div></div>
        </div>
      </div>

      <div aria-hidden="true" style="margin-top: 24px; background: #ffffff; border: 1px solid #e4e7ec; border-radius: 12px; box-shadow: 0 1px 3px #1018281a; padding: 24px; display: flex; flex-direction: column; gap: 12px">
        <div style="width: 100px; height: 18px; border-radius: 6px; background: #f2f4f7"></div>
        <div style="width: 300px; height: 14px; border-radius: 6px; background: #f2f4f7"></div>
        <div style="width: 140px; height: 20px; border-radius: 6px; background: #f2f4f7"></div>
        <div style="width: 120px; height: 20px; border-radius: 6px; background: #f2f4f7"></div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
