name: go

on:
  push:
    branches: [main]
    paths: ["services/inventory/**", "services/cart/**", "libs/go/**", "go.work", ".golangci.yml", ".github/workflows/go.yml"]
  pull_request:
    paths: ["services/inventory/**", "services/cart/**", "libs/go/**", "go.work", ".golangci.yml", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [libs/go, services/inventory, services/cart]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: golangci-lint (depguard boundaries)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2 run --config ${{ github.workspace }}/.golangci.yml ./...
      - name: Test with the race detector (needs Docker for integration tests)
        run: go test -race ./...
      - name: govulncheck (NFR-SEC-012)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
