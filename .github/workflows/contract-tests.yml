name: contract-tests

# Gherkin API contract tests for every service (cucumber-js, ADR-0025).
# Each service is built and started by the runner against a Testcontainers Postgres; ubuntu runners have Docker.
on:
  push:
    branches: [main]
    paths: ["tests/contract/**", "contracts/**", "services/catalog/**", "services/identity/**", "libs/dotnet/**",
            "apphost/HiveSpace.ServiceDefaults/**", "*.props", "global.json", ".github/workflows/contract-tests.yml"]
  pull_request:
    paths: ["tests/contract/**", "contracts/**", "services/catalog/**", "services/identity/**", "libs/dotnet/**",
            "apphost/HiveSpace.ServiceDefaults/**", "*.props", "global.json", ".github/workflows/contract-tests.yml"]

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tests/contract/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tests/contract/pnpm-lock.yaml
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Contract tests
        run: pnpm test
