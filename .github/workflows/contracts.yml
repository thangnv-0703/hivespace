name: contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", "libs/go/gen/**", "libs/python/hivespace_contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", "libs/go/gen/**", "libs/python/hivespace_contracts/**", ".github/workflows/contracts.yml"]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: buf lint
        run: npx -y @bufbuild/buf@1.75.0 lint
      - name: buf breaking (against main)
        if: github.event_name == 'pull_request'
        run: npx -y @bufbuild/buf@1.75.0 breaking --against "${{ github.workspace }}/.git#branch=origin/main,subdir=contracts"
      - name: Generated stubs are fresh
        run: npx -y @bufbuild/buf@1.75.0 generate && git diff --exit-code -- ../libs/go/gen ../libs/python/hivespace_contracts
      - name: Spectral (OpenAPI)
        run: npx -y @stoplight/spectral-cli@6.17.1 lint "openapi/*.yaml" --ruleset .spectral.yaml --fail-severity error
      - name: Spectral rejects the bank-number fixture (NFR-SEC-008)
        run: "! npx -y @stoplight/spectral-cli@6.17.1 lint spectral-fixtures/bank-number-in-response.yaml --ruleset .spectral.yaml --fail-severity error"
