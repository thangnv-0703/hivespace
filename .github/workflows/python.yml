name: python

on:
  push:
    branches: [main]
    paths: ["services/notification/**", "services/search-ai/**", "libs/python/**", "ruff.toml", ".github/workflows/python.yml"]
  pull_request:
    paths: ["services/notification/**", "services/search-ai/**", "libs/python/**", "ruff.toml", ".github/workflows/python.yml"]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [notification, search-ai]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sync (locked)
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: mypy --strict
        run: uv run mypy
      - name: import-linter (boundaries)
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest
      - name: pip-audit (NFR-SEC-012)
        run: uv export --no-dev --no-emit-project --no-emit-local --format requirements-txt > req.txt && uvx pip-audit -r req.txt --no-deps
