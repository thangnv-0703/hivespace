# Go service template (ADR-0020). Render from the repository root:
#   uvx copier@9.19.1 copy templates/go-service . -a services/<name>/.copier-answers.yml --data name=<name> --data shape=lean --data store=mongo
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

name:
  type: str
  help: Service folder name (lowercase, one word), e.g. cart
  validator: "{% if name != name | lower or '-' in name or ' ' in name or name == '' %}lowercase letters only, one word{% endif %}"

shape:
  type: str
  help: rich (internal/domain, app, transport) or lean (one package per feature)
  choices: [rich, lean]
  default: lean

store:
  type: str
  help: The service's own database (ADR-0018)
  choices: [postgres, mongo]
  default: postgres

_message_after_copy: |
  Generated services/{{ name }}. Shared files are not edited by the template; add these by hand:
    1. go.work: use ./services/{{ name }}
    2. apphost/HiveSpace.AppHost/Resources/GoServices.cs: builder.AddGoApp("{{ name }}", "../../services/{{ name }}", "./cmd/{{ name }}") with PORT and the {{ store }} reference
    3. gateway/src/Gateway/appsettings.json: a route /v1/{{ name }}/{**rest} and a cluster http://{{ name }}
  Then run `go mod tidy` in services/{{ name }}.
