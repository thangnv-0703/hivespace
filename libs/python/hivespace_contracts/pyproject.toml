[project]
name = "hivespace-contracts"
version = "0.1.0"
description = "Python gRPC stubs generated by `buf generate` from contracts/proto. Never edited by hand."
requires-python = ">=3.12,<3.13"
dependencies = [
    "grpcio>=1.75,<2",
    "protobuf>=6.32,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivespace"]
